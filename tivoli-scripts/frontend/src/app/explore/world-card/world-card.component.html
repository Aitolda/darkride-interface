<mat-card
	class="world-card"
	[ngClass]="{ offline: !world.online, small: true }"
>
	<div mat-card-image>
		<div
			class="thumbnail"
			[ngStyle]="{
				backgroundImage:
					'url(' +
					scriptService.metaverseUrl +
					'/api/domain/' +
					world.id +
					'/image' +
					')'
			}"
			(click)="onThumbnail()"
		>
			<p
				class="banner"
				style="background-color: #f44336"
				*ngIf="world.restriction == 'open'"
			>
				<mat-icon style="margin-right: 4px">error</mat-icon>
				Allows anonymous users
			</p>
			<p
				class="banner"
				style="background-color: #f44336"
				*ngIf="
					exploreService.protocol
						? world.protocol != exploreService.protocol
						: false
				"
			>
				<mat-icon style="margin-right: 4px">error</mat-icon>
				Incompatible protocol {{ world.version }}
			</p>
			<p class="label">{{ world.label }}</p>
		</div>
	</div>
	<mat-card-header>
		<div class="header">
			<h3 class="title">
				<mat-icon *ngIf="world.restriction == 'acl'">lock</mat-icon>
				{{ users }}
			</h3>
			<p class="subtitle">{{ world.username }}</p>

			<span style="flex-grow: 1"></span>

			<button
				mat-flat-button
				class="like-button"
				[class.active]="world.liked"
				(click)="onLikeWorld()"
			>
				{{ world.likes }}
				<mat-icon *ngIf="!world.liked">favorite_border</mat-icon>
				<mat-icon *ngIf="world.liked">favorite</mat-icon>
			</button>
		</div>

		<!-- <mat-card-title class="ellipses">
			{{ world.label }}
		</mat-card-title>
		<mat-card-subtitle class="ellipses">
			{{ world.username }}
		</mat-card-subtitle> -->
	</mat-card-header>
	<mat-card-content>
		<div class="ellipses">{{ world.description }}</div>
	</mat-card-content>
	<mat-card-actions *ngIf="world.instances" class="instance-actions">
		<div class="instance-summary">{{ instanceSummary }}</div>
		<button
			mat-stroked-button
			*ngIf="world.instances.list.length > 0"
			(click)="onJoinInstance()"
		>
			<mat-icon>launch</mat-icon>
			Join
		</button>
		<button
			mat-flat-button
			color="primary"
			*ngIf="world.instances.canStart"
			[disabled]="starting"
			[matMenuTriggerFor]="newInstanceMenu"
		>
			<mat-icon>add</mat-icon>
			{{ starting ? "Starting..." : "New" }}
		</button>
		<mat-menu #newInstanceMenu="matMenu">
			<button mat-menu-item (click)="onNewInstance('public')">
				<mat-icon>public</mat-icon>
				Public
			</button>
			<button mat-menu-item (click)="onNewInstance('friends')">
				<mat-icon>group</mat-icon>
				Friends
			</button>
			<button mat-menu-item (click)="onNewInstance('private')">
				<mat-icon>lock</mat-icon>
				Private (by link)
			</button>
		</mat-menu>
	</mat-card-actions>
	<!-- <mat-card-actions>
		<button mat-button (click)="onJoinWorld()">
			<mat-icon>launch</mat-icon> Join
			<span style="opacity: 0.5; font-size: 0.8em; padding-left: 8px;">
				{{ world.networkAddress + ":" + world.networkPort }}
			</span>
		</button>
	</mat-card-actions> -->
</mat-card>
