<div class="world-card" [class.has-people]="people > 0">
	<div
		class="thumbnail"
		[ngStyle]="{
			backgroundImage:
				'url(' +
				scriptService.metaverseUrl +
				'/api/domain/' +
				world.id +
				'/image' +
				')'
		}"
		(click)="onGo()"
	>
		<div class="chips">
			<span class="chip presence" *ngIf="people > 0">
				<span class="dot"></span>
				{{ people }} here
			</span>
			<span class="chip warn" *ngIf="incompatible">
				<mat-icon>error</mat-icon>
				Needs another client version ({{ world.version }})
			</span>
			<span class="chip" *ngIf="world.restriction == 'acl'">
				<mat-icon>lock</mat-icon>
				Invited only
			</span>
		</div>
		<div class="go-hint"><mat-icon>play_arrow</mat-icon></div>
		<p class="label">{{ world.label }}</p>
	</div>

	<div class="body">
		<div class="meta">
			<span class="author">by {{ world.username }}</span>
			<span class="grow"></span>
			<button
				mat-button
				class="like-button"
				[class.active]="world.liked"
				(click)="onLikeWorld()"
			>
				{{ world.likes }}
				<mat-icon>{{
					world.liked ? "favorite" : "favorite_border"
				}}</mat-icon>
			</button>
		</div>
		<p class="description">{{ world.description }}</p>
		<p class="status">{{ status }}</p>

		<div class="actions">
			<button
				mat-flat-button
				color="primary"
				class="go"
				[disabled]="starting || !canGo"
				(click)="onGo()"
			>
				<mat-icon>{{
					starting ? "hourglass_top" : "play_arrow"
				}}</mat-icon>
				{{ starting ? "Starting..." : canGo ? "Go" : "Sign in to go" }}
			</button>
			<button
				mat-stroked-button
				class="more"
				*ngIf="world.instances"
				[disabled]="starting"
				[matMenuTriggerFor]="instanceMenu"
				matTooltip="Choose an instance, or start a new one"
			>
				<mat-icon>layers</mat-icon>
				<mat-icon class="caret">arrow_drop_down</mat-icon>
			</button>
		</div>
	</div>

	<mat-menu
		#instanceMenu="matMenu"
		class="dr-instance-menu"
		xPosition="before"
	>
		<ng-container *ngIf="places.length > 0">
			<div class="menu-heading">Running now</div>
			<button
				mat-menu-item
				*ngFor="let place of places"
				(click)="onJoin(place)"
			>
				<mat-icon>{{ place.icon }}</mat-icon>
				<span class="place">
					<span class="place-name">{{ place.name }}</span>
					<span class="place-detail">{{ place.detail }}</span>
				</span>
			</button>
			<div class="menu-divider"></div>
		</ng-container>
		<ng-container *ngIf="world.instances?.canStart">
			<div class="menu-heading">Start a new instance</div>
			<button mat-menu-item (click)="onNewInstance('public')">
				<mat-icon>public</mat-icon>
				<span class="place">
					<span class="place-name">Public</span>
					<span class="place-detail">Anyone can join</span>
				</span>
			</button>
			<button mat-menu-item (click)="onNewInstance('friends')">
				<mat-icon>group</mat-icon>
				<span class="place">
					<span class="place-name">Friends</span>
					<span class="place-detail">Your friends can join</span>
				</span>
			</button>
			<button mat-menu-item (click)="onNewInstance('private')">
				<mat-icon>lock</mat-icon>
				<span class="place">
					<span class="place-name">Private</span>
					<span class="place-detail"
						>Only people you send the link to</span
					>
				</span>
			</button>
		</ng-container>
		<div class="menu-heading" *ngIf="!world.instances?.canStart">
			Sign in to start an instance
		</div>
	</mat-menu>
</div>
